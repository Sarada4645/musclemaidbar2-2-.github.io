<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2‐2割引券‼</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      font-family: sans-serif;
      text-align: center;
      color: #222;
    }

    .coupon {
      max-width: 500px;
      margin: 30px auto;
      padding: 30px 20px;
      background: white;
      border: 4px dashed #ff4b4b;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    h1 {
      color: #ff3333;
      font-size: 28px;
      margin-top: 0;
    }

    h2 {
      font-size: 26px;
      color: #111;
      margin: 25px 0;
    }

    p {
      line-height: 1.8;
      font-size: 16px;
    }

    .place {
      background: #fff3f3;
      padding: 15px;
      border-radius: 10px;
      margin: 20px 0;
    }

    button {
      width: 90%;
      max-width: 350px;
      padding: 18px;
      margin: 15px 0;
      border: none;
      border-radius: 12px;
      background: #ff3333;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    .notice {
      font-size: 13px;
      color: #777;
    }

    .used {
      color: #999;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="coupon">

    <h1>🎉 読み取った人限定割引券‼ 🎉</h1>

    <h2>ドリンク各種<br>100円引き！</h2>

    <p>
      お会計の際、店員さんに<br>
      この画面を見せてください。
    </p>

    <div class="place">
      <strong>
        北館【ノースフロンティア(笑)】4階
      </strong>
      <br>
      階段を上がって目の前の<br>
      「マッスルメイドバー」です！
      <br><br>
      ZAVASが定価以下で飲めちゃいます！
    </div>

    <button id="useButton" onclick="useCoupon()">
      クーポンを使う
    </button>

    <p class="notice">
      ※このクーポンは1回のみ使用できます。
    </p>

  </div>

  <script>
    function useCoupon() {
      const confirmed = confirm(
        "このクーポンを使用しますか？\n\n使用すると元に戻せません。"
      );

      if (confirmed) {
        document.getElementById("useButton").disabled = true;
        document.getElementById("useButton").style.display = "none";

        const message = document.createElement("p");
        message.className = "used";
        message.textContent = "✅ クーポン使用済み";
        
        document.querySelector(".coupon").appendChild(message);
      }
    }
  </script>

</body>
</html>
